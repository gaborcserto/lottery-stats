name: lottery-stats

services:
  api:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-60}
    volumes:
      - ./apps/api:/var/www/html
      - api_vendor:/var/www/html/vendor
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 2s
      timeout: 2s
      retries: 30

  lottery-sync:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./apps/api:/var/www/html
      - api_vendor:/var/www/html/vendor
    entrypoint: ["php", "artisan"]
    command: ["lottery:sync", "--startup"]
    restart: "no"

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    depends_on:
      - api
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      PRERENDER_API_BASE_URL: http://api:8000/api/v1
    command: >-
      sh -c 'if [ ! -x node_modules/.bin/react-router ]; then npm ci; fi;
      exec npm run dev -- --host 0.0.0.0'

volumes:
  api_vendor:
  web_node_modules:
